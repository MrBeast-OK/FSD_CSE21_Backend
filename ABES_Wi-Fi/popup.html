<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.6);
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
            --success: #22c55e;
            --error: #ef4444;
            --input-bg: rgba(15, 23, 42, 0.6);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 340px;
            min-height: 100px;
            padding: 0;
            margin: 0;
            background: var(--bg);
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 100%, rgba(168, 85, 247, 0.1) 0%, transparent 60%);
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .popup-wrapper {
            padding: 24px;
            animation: slideUp 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .icon-badge {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--primary-glow);
            flex-shrink: 0;
        }

        .header-text h1 {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .header-text p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Status indicator */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 18px;
            font-size: 0.78rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 6px rgba(34, 197, 94, 0.5);
            animation: pulse 2s infinite;
        }

        .status-dot.inactive {
            background: var(--text-muted);
            box-shadow: none;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text { color: var(--text-muted); flex: 1; }
        .status-text.active { color: var(--success); }

        /* Form */
        .form-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .input-row {
            position: relative;
        }

        .input-row label {
            display: block;
            font-size: 0.72rem;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 6px;
        }

        .input-row input {
            width: 100%;
            padding: 10px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.88rem;
            transition: all 0.2s ease;
            outline: none;
        }

        .input-row input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        .input-row input::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        .url-row input {
            font-size: 0.8rem;
            padding: 9px 14px;
        }

        /* Buttons */
        .btn-login {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            background: linear-gradient(135deg, var(--primary), #7c3aed);
            color: white;
            box-shadow: 0 4px 16px var(--primary-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.45);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login.loading {
            pointer-events: none;
            opacity: 0.85;
        }

        .btn-login .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        .btn-login.loading .spinner { display: block; }
        .btn-login.loading .btn-text { display: none; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Footer links */
        .footer-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .footer-link {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: none;
            font-family: inherit;
            transition: color 0.2s;
            padding: 0;
        }

        .footer-link:hover { color: var(--primary); }

        /* Feedback message */
        .feedback {
            text-align: center;
            font-size: 0.78rem;
            min-height: 20px;
            margin-top: 10px;
            transition: all 0.3s;
            opacity: 0;
        }

        .feedback.show { opacity: 1; }
        .feedback.success { color: var(--success); }
        .feedback.error { color: var(--error); }

        /* Toggle password */
        .pass-wrapper {
            position: relative;
        }

        .pass-wrapper input {
            padding-right: 40px;
        }

        .toggle-pass {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            line-height: 1;
            font-size: 0.85rem;
        }

        .toggle-pass:hover { color: var(--text); }
    </style>
</head>
<body>
    <div class="popup-wrapper">
        <!-- Header -->
        <div class="header">
            <div class="icon-badge">
                <svg viewBox="0 0 24 24" width="22" height="22" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
                    <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
                    <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                    <line x1="12" y1="20" x2="12.01" y2="20"></line>
                </svg>
            </div>
            <div class="header-text">
                <h1>UniConnect</h1>
                <p>College Wi-Fi Auto Login</p>
            </div>
        </div>

        <!-- Status -->
        <div class="status-bar" id="statusBar">
            <div class="status-dot" id="statusDot"></div>
            <span class="status-text" id="statusText">Ready to connect</span>
        </div>

        <!-- Login Form -->
        <div class="form-section">
            <div class="input-row">
                <label for="loginId">Login ID</label>
                <input type="text" id="loginId" placeholder="e.g. 2021BCS001" autocomplete="off" spellcheck="false">
            </div>
            <div class="input-row">
                <label for="loginPass">Password</label>
                <div class="pass-wrapper">
                    <input type="password" id="loginPass" placeholder="••••••••" autocomplete="off">
                    <button class="toggle-pass" id="togglePass" title="Show/Hide password">👁</button>
                </div>
            </div>
            <div class="input-row url-row" style="display:none;">
                <label for="portalUrl">Captive Portal URL</label>
                <input type="url" id="portalUrl" value="http://192.168.1.254:8090/httpclient.html" autocomplete="off" spellcheck="false">
            </div>
        </div>

        <!-- Login Button -->
        <button class="btn-login" id="loginBtn">
            <span class="btn-text">⚡ Login Now</span>
            <div class="spinner"></div>
        </button>

        <div class="feedback" id="feedback"></div>

        <!-- Footer -->
        <div class="footer-row">
            <button class="footer-link" id="saveCredentials">💾 Save Credentials</button>
            <button class="footer-link" id="openSettings">⚙ Advanced Settings</button>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
